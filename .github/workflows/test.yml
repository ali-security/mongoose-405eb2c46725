name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha grep filter'
        required: false
        default: ''
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-22.04, ubuntu-24.04]
        mongodb: [6.0.15, 7.0.12, 8.2.0]
        include:
          - os: ubuntu-22.04 # customize on which matrix the coverage will be collected on
            mongodb: 6.0.15
            node: 22
            coverage: true
    name: Node ${{ matrix.node }} MongoDB ${{ matrix.mongodb }} OS ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MONGOMS_VERSION: ${{ matrix.mongodb }}
      MONGOMS_PREFER_GLOBAL_PATH: 1
      FORCE_COLOR: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ matrix.os }}-${{ matrix.mongodb }}

      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T19:37:21.947000Z

      - run: npm install
      # Create ./node_modules/mongoose-separate-require-instance for testing multiple require instances
      - run: npm run create-separate-require-instance
      - name: NPM Test without Coverage
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test:ci
          fi
        if: matrix.coverage != true
      - name: NPM Test with Coverage
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx c8 --reporter=html --reporter=text npm run test:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test-coverage:ci
          fi
        if: matrix.coverage == true

  test-deno:
    runs-on: ubuntu-22.04
    name: Deno tests
    timeout-minutes: 35
    env:
      MONGOMS_VERSION: 6.0.15
      MONGOMS_PREFER_GLOBAL_PATH: 1
      FORCE_COLOR: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Load MongoDB binary cache
        id: cache-mongodb-binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: deno-${{ env.MONGOMS_VERSION }}
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.1.x
      - run: deno --version
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T19:37:21.947000Z
      - run: npm install
      - name: Run Deno tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test-deno:ci -- -g "${{ inputs.test-filter }}"
          else
            npm run test-deno:ci
          fi

  test-atlas-cli:
    runs-on: ubuntu-22.04
    name: Atlas CLI tests
    timeout-minutes: 35
    env:
      IS_ATLAS: true
      MONGOOSE_TEST_URI: mongodb://127.0.0.1:27017/mongoose_test?directConnection=true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup AtlasCLI
        uses: mongodb/atlas-github-action@e3c9e0204659bafbb3b65e1eb1ee745cca0e9f3b # v0.2.2
      - name: Setup local Atlas deployment
        run: atlas deployments setup mycluster --type local --force --port 27017
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T19:37:21.947000Z
      - run: npm install
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test:ci
          fi
      - name: Stop deployment
        run: atlas deployments stop mycluster

  test-replica-sets:
    runs-on: ubuntu-22.04
    name: Replica Set tests
    timeout-minutes: 35
    env:
      FORCE_COLOR: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T19:37:21.947000Z
      - run: npm install
      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test-rs:ci -- --grep "${{ inputs.test-filter }}"
          else
            npm run test-rs:ci
          fi

  dependency-review:
    name: Dependency Review
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  pack:
    runs-on: ubuntu-latest
    name: Pack npm tarball
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Match the npm that packed the public tarball
        run: npm i -g npm@11.13.0
      - name: Pack
        run: npm pack
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: mongoose-9.7.0.tgz
          if-no-files-found: error
